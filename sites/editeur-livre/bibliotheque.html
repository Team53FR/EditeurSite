<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mes livres — Mon Éditeur De Livre</title>
<link rel="stylesheet" href="../../polices/polices.css">
<link rel="stylesheet" href="site.css">
<link rel="stylesheet" href="tutoriel.css">
<link rel="icon" href="icone-192.png">
<link rel="apple-touch-icon" href="icone-192.png">
</head>
<body>

  <!-- ===== Navigation ===== -->
  <nav class="nav">
    <div class="contenu nav-in">
      <a href="index.html" class="marque">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#8a4b38" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5.5C10.5 4.3 8.3 3.8 6 4c-1 .1-2 .3-3 .6v14c1-.3 2-.5 3-.6 2.3-.2 4.5.3 6 1.5 1.5-1.2 3.7-1.7 6-1.5 1 .1 2 .3 3 .6V4.6c-1-.3-2-.5-3-.6-2.3-.2-4.5.3-6 1.5Z"/><path d="M12 5.5v14"/></svg>
        Mon Éditeur De Livre
      </a>
      <div class="nav-actions">
        <button class="btn-aide-tuto" onclick="lancerTutorielBiblio(true)" title="Revoir le tutoriel">?</button>
        <a href="utilisateurs.html" id="btnAdmin" class="btn btn-secondaire" style="display:none">⚙ Gestion des utilisateurs</a>
        <button class="btn btn-fantome" onclick="seDeconnecter()">Se déconnecter</button>
      </div>
    </div>
  </nav>

  <!-- ===== En-tête profil ===== -->
  <header class="profil-entete">
    <div class="contenu profil-in">
      <div class="avatar" id="avatarInitiales">—</div>
      <div class="profil-txt">
        <div class="salut">Bon retour parmi nous,</div>
        <div class="nom-ligne">
          <h1 id="profilNom">…</h1>
          <button id="btnModifNom" class="btn-icone-nom" onclick="modifierNom()" title="Modifier mon nom d'affichage">✎</button>
        </div>
        <div id="editionNom" class="edition-nom" style="display:none">
          <input type="text" id="champNom" maxlength="40" placeholder="Votre nom d'affichage"
                 onkeydown="if(event.key==='Enter'){enregistrerNom();}else if(event.key==='Escape'){annulerNom();}">
          <button class="btn-mini" onclick="enregistrerNom()">Enregistrer</button>
          <button class="btn-mini" onclick="annulerNom()">Annuler</button>
        </div>
        <div class="profil-stats">
          <div class="stat"><b id="statLivres">0</b><span>livre(s)</span></div>
          <div class="stat"><b id="statPages">0</b><span>page(s) au total</span></div>
        </div>
      </div>
    </div>
  </header>

  <!-- ===== Contenu ===== -->
  <main class="contenu">

    <!-- Deux onglets plutôt qu'une pile : un résumé de série tient plusieurs
         paragraphes, et la liste des livres se retrouvait poussée hors de
         l'écran. Les onglets servent aussi de titres de section. -->
    <div class="onglets-biblio" role="tablist" aria-label="Bibliothèque">
      <button type="button" id="ongletLivres" class="onglet-biblio actif"
              role="tab" aria-selected="true" aria-controls="panneauLivres"
              onclick="choisirOngletBiblio('livres')">
        Mes livres <span class="onglet-compte" id="compteLivres">0</span>
      </button>
      <button type="button" id="ongletSeries" class="onglet-biblio"
              role="tab" aria-selected="false" aria-controls="panneauSeries"
              onclick="choisirOngletBiblio('series')">
        Mes séries <span class="onglet-compte" id="compteSeries">0</span>
      </button>
    </div>

    <section id="panneauLivres" role="tabpanel" aria-labelledby="ongletLivres">
      <ul id="listeLivres" class="grille-livres"></ul>

      <div class="creer-livre">
        <h3>Créer un nouveau livre</h3>
        <div class="creer-ligne">
          <input type="text" id="titreNouveauLivre" placeholder="Titre du nouveau livre"
                 onkeydown="if(event.key==='Enter'){creerLivre();}">
          <button type="button" id="formatNouveauLivre" class="bouton-format" onclick="ouvrirChoixFormatCreation()">Roman — 14,9 × 21,0 cm</button>
          <button class="btn btn-primaire" onclick="creerLivre()">+ Créer un livre</button>
        </div>
      </div>
    </section>

    <!-- Une série ne fait que RANGER des livres : chaque tome reste listé
         dans « Mes livres » et s'ouvre comme n'importe quel autre. -->
    <section id="panneauSeries" role="tabpanel" aria-labelledby="ongletSeries" hidden>
      <!-- Deux vues dans le même onglet : la liste des séries, en boutons, puis
           le détail de celle sur laquelle on a cliqué (résumé, et ses tomes
           dans l'ordre). Une seule est visible à la fois. -->
      <div id="vueListeSeries">
        <div class="barre-series">
          <button type="button" class="btn btn-primaire" onclick="ouvrirEditionSerie()">+ Créer une série</button>
        </div>
        <ul id="listeSeries" class="liste-series"></ul>
      </div>
      <div id="vueDetailSerie" class="serie-detail" hidden></div>
    </section>

    <p id="message" class="message"></p>
  </main>

  <!-- Statistiques d'un livre (clic sur la ligne « format · pages » d'une carte) -->
  <div id="modalStats" class="modal-fond" style="display:none" onclick="fermerStatsLivre()">
    <div class="modal-carte" role="dialog" aria-modal="true" aria-label="Statistiques du livre"
         onclick="event.stopPropagation()">
      <button class="modal-fermer" onclick="fermerStatsLivre()" aria-label="Fermer">&#10005;</button>
      <div id="statsContenu"></div>
    </div>
  </div>

  <!-- Créer ou modifier une série : son titre, son résumé, et les tomes
       qu'elle range, dans l'ordre. -->
  <div id="modalSerie" class="modal-fond" style="display:none" onclick="fermerEditionSerie()">
    <div class="modal-carte" role="dialog" aria-modal="true" aria-label="Série"
         onclick="event.stopPropagation()">
      <button class="modal-fermer" onclick="fermerEditionSerie()" aria-label="Fermer">&#10005;</button>
      <h3 id="serieTitreFenetre">Nouvelle série</h3>

      <label class="serie-label" for="serieTitre">Titre de la série</label>
      <input type="text" id="serieTitre" class="serie-champ" maxlength="120"
             placeholder="Le nom de l'histoire, pas celui d'un tome">

      <label class="serie-label" for="serieResume">Résumé de l'histoire</label>
      <textarea id="serieResume" class="serie-champ serie-resume" rows="5"
                placeholder="De quoi parle l'ensemble des tomes ?"></textarea>

      <div id="serieBlocTomes" class="stats-bloc">
        <h4>Les tomes <span class="h4-aide">— dans l'ordre de lecture</span></h4>
        <ul id="serieTomes" class="serie-tomes"></ul>
        <div class="serie-ajout">
          <select id="serieAjoutLivre" class="serie-champ"></select>
          <button type="button" class="btn-mini" onclick="ajouterTomeAlaSerie()">Ajouter ce livre</button>
        </div>
      </div>

      <p id="serieMessage" class="message"></p>

      <div class="serie-actions">
        <button type="button" id="serieSupprimer" class="btn btn-danger" onclick="supprimerSerieCourante()">Supprimer la série</button>
        <button type="button" class="btn btn-fantome" onclick="fermerEditionSerie()">Annuler</button>
        <button type="button" class="btn btn-primaire" onclick="enregistrerSerie()">Enregistrer</button>
      </div>
    </div>
  </div>

  <script src="attente.js"></script>
  <script src="script.js"></script>
  <script src="tutoriel.js"></script>
  <script src="bibliotheque.js"></script>
  <script src="retour-portail.js"></script>
  <script src="../../pied-legal.js"></script>
</body>
</html>
