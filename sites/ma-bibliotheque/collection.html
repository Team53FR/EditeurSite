<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<title>Ma Bibliothèque</title>
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icone-192.png">
<link rel="apple-touch-icon" href="icone-192.png">
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
  }
</script>
</head>
<body>

  <header class="app-header">
    <div class="app-header-ligne">
      <h1>📚 Ma Bibliothèque</h1>
      <button class="icone-deconnexion" title="Se déconnecter" onclick="seDeconnecter()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      </button>
    </div>
    <div class="recherche">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="champRecherche" placeholder="Rechercher un livre..." oninput="afficherLivres()">
    </div>
  </header>

  <main class="contenu" id="contenu">
    <div class="chargement" id="chargement"><span class="spin"></span> Chargement de ta collection…</div>
    <div class="grille-livres" id="grilleLivres" style="display:none"></div>
    <div class="etat-vide" id="etatVide" style="display:none">
      <div class="pastille-lg">📚</div>
      <h2 id="etatVideTitre">Aucun livre pour l'instant</h2>
      <p>Touche le bouton + pour ajouter ton premier livre.</p>
    </div>
  </main>

  <button class="fab" id="boutonAjouter" title="Ajouter un livre" onclick="ouvrirMenuAjout()">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
  </button>

  <!-- Feuille : choix du mode d'ajout -->
  <div class="voile" id="voileMenuAjout" onclick="if(event.target===this) fermerMenuAjout()">
    <div class="feuille">
      <div class="feuille-entete">
        <h2>Ajouter un livre</h2>
        <button onclick="fermerMenuAjout()" title="Fermer">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="feuille-corps" style="display:flex;flex-direction:column;gap:0.7rem;">
        <button type="button" class="option-menu" onclick="demarrerScan()">
          <span class="option-menu-icone">📷</span>
          <span>
            <strong>Scanner un code-barres</strong>
            <small>Remplit automatiquement titre, auteur et couverture</small>
          </span>
        </button>
        <button type="button" class="option-menu" onclick="ouvrirFormulaireManuel()">
          <span class="option-menu-icone">✏️</span>
          <span>
            <strong>Ajouter manuellement</strong>
            <small>Renseigne toi-même les informations</small>
          </span>
        </button>
      </div>
    </div>
  </div>

  <!-- Plein écran : scan du code-barres -->
  <div class="scanner-overlay" id="scannerOverlay" style="display:none">
    <div class="scanner-entete">
      <span id="scannerStatut">Vise le code-barres du livre</span>
      <button onclick="arreterScan()" title="Annuler">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div id="lecteurVideo" class="scanner-video"></div>
    <p class="scanner-aide">Le code-barres (ISBN) est au dos du livre.</p>
  </div>

  <!-- Feuille : ajout / édition d'un livre -->
  <div class="voile" id="voileFormulaire" onclick="if(event.target===this) fermerFormulaire()">
    <div class="feuille">
      <div class="feuille-entete">
        <h2 id="titreFormulaire">Ajouter un livre</h2>
        <button onclick="fermerFormulaire()" title="Fermer">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>

      <div class="feuille-corps">
        <div class="zone-couverture">
          <div class="apercu-couverture" id="apercuCouverture">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
          </div>
          <div class="actions-couverture">
            <button type="button" class="btn btn-secondaire" onclick="declencherChoixImage('camera')">
              📷 Prendre une photo
            </button>
            <button type="button" class="btn btn-secondaire" onclick="declencherChoixImage('galerie')">
              🖼️ Choisir dans la galerie
            </button>
            <button type="button" class="btn btn-fantome" id="boutonSupprimerImage" onclick="retirerImage()" style="display:none">
              Retirer la couverture
            </button>
          </div>
        </div>
        <input type="file" accept="image/*" capture="environment" id="champImageCamera" style="display:none" onchange="imageChoisie(event)">
        <input type="file" accept="image/*" id="champImageGalerie" style="display:none" onchange="imageChoisie(event)">

        <div class="champ">
          <label for="champTitre">Titre du livre / de la série</label>
          <input type="text" id="champTitre" placeholder="Ex. One Piece">
        </div>

        <div class="champ">
          <label for="champAuteur">Auteur (optionnel)</label>
          <input type="text" id="champAuteur" placeholder="Ex. Eiichiro Oda">
        </div>

        <div class="champ">
          <label>Nombre de tomes existants</label>
          <div class="champ-nombre">
            <button type="button" onclick="changerTotalTomes(-1)">−</button>
            <input type="number" id="champTotalTomes" min="1" max="999" value="1" oninput="regenererGrilleTomes()">
            <button type="button" onclick="changerTotalTomes(1)">+</button>
          </div>
        </div>

        <div class="champ">
          <label>Tomes que tu possèdes</label>
          <div class="grille-tomes" id="grilleTomes"></div>
          <div class="raccourcis-tomes">
            <button type="button" onclick="cocherTousLesTomes(true)">Tout cocher</button>
            <button type="button" onclick="cocherTousLesTomes(false)">Tout décocher</button>
          </div>
        </div>

        <div class="zone-danger" id="zoneSuppression" style="display:none">
          <div class="separateur-form"></div>
          <button type="button" class="btn btn-danger btn-bloc" onclick="supprimerLivreCourant()">Supprimer ce livre</button>
        </div>
      </div>

      <div class="feuille-pied">
        <button class="btn btn-secondaire" onclick="fermerFormulaire()">Annuler</button>
        <button class="btn btn-primaire" id="boutonEnregistrer" onclick="enregistrerLivre()">Enregistrer</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="script.js"></script>
  <script src="collection.js"></script>
</body>
</html>
