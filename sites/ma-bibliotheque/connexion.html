<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<title>Connexion — Ma Bibliothèque</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page-centree">
    <div class="carte-auth">
      <div class="marque-auth">
        <span class="pastille">📚</span>
        Ma Bibliothèque
      </div>

      <h1>Connexion</h1>
      <p class="intro">Retrouve ta collection de livres.</p>

      <div class="champ">
        <label for="login">Identifiant</label>
        <input type="text" id="login" placeholder="Ton identifiant" autocomplete="username">
      </div>

      <div class="champ">
        <label for="password">Mot de passe</label>
        <input type="password" id="password" placeholder="Ton mot de passe" autocomplete="current-password">
      </div>

      <div class="champ">
        <label for="token">Token GitHub</label>
        <input type="password" id="token" placeholder="ghp_xxxxxxxxxxxx" autocomplete="off"
               onkeydown="if(event.key==='Enter'){seConnecter();}">
      </div>
      <p class="aide-champ">Le token sert à enregistrer ta collection. Il reste uniquement dans cet onglet et n'est jamais stocké ailleurs.</p>

      <button class="btn btn-primaire btn-bloc" onclick="seConnecter()">Se connecter</button>

      <p id="message" class="message"></p>

      <p class="retour"><a href="index.html">← Retour à l'accueil</a></p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
