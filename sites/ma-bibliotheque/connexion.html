<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4efe4">
<meta name="theme-color" content="#14110c" media="(prefers-color-scheme: dark)">
<title>Connexion — Ma Bibliothèque</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script>
  // Déjà connecté : cette page n'a pas lieu d'être affichée.
  // location.replace() et non href : pousser une entrée dans l'historique
  // ferait rebondir « retour » entre cette page et la destination, sans
  // jamais permettre de remonter plus haut.
  (function () {
    try {
      if (localStorage.getItem("mb_token") || localStorage.getItem("team53_token")) {
        location.replace("collection.html");
      }
    } catch (e) {}
  })();
</script>

<link rel="manifest" href="manifest.json">
<link rel="icon" href="icone-192.png">
<link rel="apple-touch-icon" href="icone-192.png">
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
  }
</script>
</head>
<body>
  <div class="page-centree">
    <div class="carte-auth">
      <div class="marque-auth">
        <span class="pastille">📚</span>
        Ma Bibliothèque
      </div>

      <h1>Connexion</h1>
      <p class="intro">Retrouve ta collection de livres.</p>

      <div class="champ">
        <label for="login">Identifiant</label>
        <input type="text" id="login" placeholder="Ton identifiant" autocomplete="username">
      </div>

      <div class="champ">
        <label for="password">Mot de passe</label>
        <input type="password" id="password" placeholder="Ton mot de passe" autocomplete="current-password">
      </div>

      <div class="champ">
        <label for="token">Token GitHub</label>
        <input type="password" id="token" placeholder="ghp_xxxxxxxxxxxx" autocomplete="off"
               onkeydown="if(event.key==='Enter'){seConnecter();}">
      </div>
      <p class="aide-champ">Le token sert à lire et enregistrer vos données. Il reste mémorisé sur cet appareil, pour tous les sites du portail — vous ne le retapez plus. Déconnectez-vous si vous prêtez l'appareil.</p>

      <button class="btn btn-primaire btn-bloc" onclick="seConnecter()">Se connecter</button>

      <p id="message" class="message"></p>

      <p class="retour"><a href="index.html">← Retour à l'accueil</a></p>
    </div>
  </div>

  <script src="script.js"></script>
  <script src="retour-portail.js"></script>
</body>
</html>
