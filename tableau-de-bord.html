<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<title>Tableau de bord — Team53FR</title>
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icone-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Site Guide">
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
  }
</script>

</head>
<body>
  <header class="app-header">
    <div class="app-header-ligne">
      <h1><span id="entete-pastille">🔐</span> Team53FR</h1>
      <div class="actions-entete">
        <a href="admin-comptes.html" id="lien-admin" class="icone-bouton" title="Gestion des comptes" style="display:none">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </a>
        <button class="icone-bouton deconnexion" title="Se déconnecter" onclick="seDeconnecter()">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        </button>
      </div>
    </div>
  </header>

  <div class="contenu">
    <div id="encart-app" class="encart-app" hidden>
      <img src="icone-192.png" alt="" width="48" height="48">
      <div class="encart-app-texte">
        <strong>Installer l'application</strong>
        <span id="encart-app-detail">Le portail s'ajoute à votre écran d'accueil et s'ouvre en plein écran.</span>
      </div>
      <button type="button" class="btn btn-primaire" id="btn-installer">Installer</button>
      <button type="button" class="btn btn-fantome" id="btn-fermer-encart" aria-label="Masquer">✕</button>
    </div>

    <div id="zone-sites"></div>
  </div>

  <script src="script.js"></script>
  <script>
    async function initTableauDeBord() {
      const token = exigerConnexionCentrale();
      if (!token) return;

      const nom = localStorage.getItem("team53_nom");
      if (nom) document.querySelector(".app-header h1").innerHTML =
        '<span id="entete-pastille">🔐</span> Bonjour, ' + echapper(nom);

      if (localStorage.getItem("team53_role") === "admin") {
        document.getElementById("lien-admin").style.display = "";
      }

      const acces = JSON.parse(localStorage.getItem("team53_acces") || "[]");
      const zone = document.getElementById("zone-sites");
      let sites;
      try {
        sites = await chargerSites(token);
      } catch (e) {
        sites = DEFAULT_SITES;
      }

      const autorises = sites.filter(s => acces.includes(s.id));

      if (!autorises.length) {
        zone.innerHTML =
          '<div class="etat-vide">' +
          '<div class="pastille-lg" style="margin:0 auto 1rem;">🔒</div>' +
          '<h2>Aucun site accessible</h2>' +
          '<p>Demande à un administrateur de t\'accorder l\'accès à un site.</p>' +
          '</div>';
        return;
      }

      const grille = document.createElement("div");
      grille.className = "grille-sites";
      autorises.forEach(site => {
        const carte = document.createElement("button");
        carte.className = "carte-site";
        carte.innerHTML =
          '<div class="icone-site">' + (site.icone || "🌐") + '</div>' +
          '<h2>' + echapper(site.nom) + '</h2>' +
          '<p>' + echapper(site.description || "") + '</p>';
        carte.addEventListener("click", () => relayerVersSite(site));
        grille.appendChild(carte);
      });
      zone.innerHTML = "";
      zone.appendChild(grille);
    }

    function echapper(txt) {
      const d = document.createElement("div");
      d.textContent = txt == null ? "" : String(txt);
      return d.innerHTML;
    }

    initTableauDeBord();
  </script>

  <script>
    // ===== Installation de l'application =====
    // Un site web ne peut pas livrer un fichier d'app : il s'INSTALLE.
    // Sur Android/Chrome le navigateur propose l'installation via
    // beforeinstallprompt, que l'on retient pour l'offrir sur ce bouton.
    // Safari iOS n'expose rien de tel : on y explique le geste à faire.
    (function () {
      const encart = document.getElementById("encart-app");
      const detail = document.getElementById("encart-app-detail");
      const bouton = document.getElementById("btn-installer");
      const fermer = document.getElementById("btn-fermer-encart");
      let invite = null;

      const dejaInstallee = () =>
        window.matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;

      const estIOS = () =>
        /iphone|ipad|ipod/i.test(navigator.userAgent) ||
        // iPadOS 13+ se presente comme un Mac tactile
        (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

      // Masque volontairement pose : on ne re-propose pas a chaque visite.
      if (dejaInstallee() || localStorage.getItem("team53_encart_app") === "masque") return;

      window.addEventListener("beforeinstallprompt", (e) => {
        e.preventDefault();          // on declenche nous-memes, sur le bouton
        invite = e;
        encart.hidden = false;
      });

      if (estIOS()) {
        detail.textContent = "Sur iPhone : bouton Partager, puis « Sur l'écran d'accueil ».";
        bouton.hidden = true;
        encart.hidden = false;
      }

      bouton.addEventListener("click", async () => {
        if (!invite) return;
        bouton.disabled = true;
        invite.prompt();
        try { await invite.userChoice; } catch (e) { /* choix indisponible */ }
        invite = null;
        encart.hidden = true;
      });

      fermer.addEventListener("click", () => {
        encart.hidden = true;
        localStorage.setItem("team53_encart_app", "masque");
      });

      window.addEventListener("appinstalled", () => { encart.hidden = true; });
    })();
  </script>
</body>
</html>
