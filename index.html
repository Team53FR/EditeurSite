<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
  }
</script>

<script>
  // Déjà connecté : direction le tableau de bord.
  // location.replace() et non href : pousser une entrée dans l'historique
  // ferait rebondir « retour » entre cette page et la destination, sans
  // jamais permettre de remonter plus haut.
  (function () {
    try {
      if (localStorage.getItem("team53_token") || localStorage.getItem("team53_token")) {
        location.replace("tableau-de-bord.html");
      }
    } catch (e) {}
  })();
</script>
<link rel="icon" href="icone-192.png">
</head>
<body>
  <div class="page-centree">
    <div class="hero">
      <div class="pastille-lg">🔐</div>
      <h1>Team53FR</h1>
      <p>Un seul compte pour accéder aux sites qui te sont autorisés.</p>
      <a class="btn btn-primaire btn-bloc" href="connexion.html">Se connecter</a>
    </div>
  </div>
</body>
