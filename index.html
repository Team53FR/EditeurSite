<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Team53FR — Sites</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f6f5f2;
      --card-bg: #ffffff;
      --text: #1c1c1c;
      --muted: #6b6b6b;
      --accent: #2b6cb0;
      --border: #e2e0da;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2rem;
      padding: 3rem 1.5rem;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    header { text-align: center; }
    h1 { margin: 0 0 0.5rem; font-size: 1.8rem; }
    p.subtitle { margin: 0; color: var(--muted); }
    .sites {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 1.25rem;
      width: 100%;
      max-width: 760px;
    }
    a.site-card {
      display: block;
      padding: 1.5rem;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      text-decoration: none;
      color: inherit;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    a.site-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(0,0,0,0.08);
    }
    a.site-card h2 {
      margin: 0 0 0.4rem;
      font-size: 1.15rem;
      color: var(--accent);
    }
    a.site-card p {
      margin: 0;
      font-size: 0.9rem;
      color: var(--muted);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #16171a;
        --card-bg: #1f2023;
        --text: #f0efec;
        --muted: #9a9a9a;
        --accent: #6ea8dc;
        --border: #2c2d31;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>Team53FR</h1>
    <p class="subtitle">Portail des sites hébergés dans ce dépôt</p>
  </header>
  <div class="sites">
    <a class="site-card" href="sites/editeur-livre/index.html">
      <h2>Éditeur de livre</h2>
      <p>Créez, mettez en page et imprimez vos livres en ligne.</p>
    </a>
    <!-- Ajouter ici une nouvelle carte pour chaque site ajouté dans sites/ -->
  </div>
</body>
</html>
